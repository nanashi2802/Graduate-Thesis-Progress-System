<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PUP CpE Thesis Progress Monitoring System</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              maroon: '#800000',
              'maroon-hover': '#660000',
              'maroon-tint': '#FDF2F2',
              gold: '#D97706',
              'gold-tint': '#FFFBEB'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }
    .badge-mono {
      font-family: 'JetBrains Mono', monospace;
      font-feature-settings: "tnum";
    }
  </style>
</head>
<body class="min-h-screen flex flex-col relative selection:bg-red-100 selection:text-brand-maroon">

  <!-- Top Global Bar -->
  <header class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center space-x-3">
      <div class="w-7 h-7 bg-brand-maroon rounded flex items-center justify-center text-white font-bold text-xs tracking-wider shadow-sm">
        PUP
      </div>
      <div class="flex items-center space-x-2">
        <span class="font-semibold text-slate-900 text-sm tracking-tight">PUP Graduate CpE</span>
        <span class="text-slate-300">/</span>
        <span class="text-xs text-slate-500 font-medium">Thesis Progress</span>
      </div>
    </div>

    <div class="flex items-center space-x-2 text-xs text-slate-600">
      <div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center font-semibold text-slate-700 text-xs" id="top-user-avatar">
        JD
      </div>
      <div class="hidden sm:block text-left">
        <div class="font-medium text-slate-900 leading-tight" id="top-user-name">Juan Dela Cruz</div>
        <div class="text-[10px] text-slate-500" id="top-user-role">Student</div>
      </div>
    </div>
  </header>

  <!-- Root App Shell Container (Sidebar + Content Workspace) -->
  <div class="flex-1 flex overflow-hidden min-h-[calc(100vh-3.5rem)]">
    <!-- Sidebar Navigation -->
    <aside id="main-sidebar" class="w-60 bg-white border-r border-slate-200 flex flex-col justify-between flex-shrink-0 transition-all duration-200">
      <div class="p-4 space-y-6">
        <nav id="sidebar-nav-links" class="space-y-1"></nav>

        <div>
          <div class="bg-slate-50 rounded-lg p-3 border border-slate-200 text-xs space-y-2">
            <div class="font-semibold text-slate-900 leading-snug line-clamp-2">EchoWood: Embedded Termite Detection via ESP32-S3</div>
            <div class="flex items-center justify-between text-[11px] text-slate-500">
              <span>Milestone:</span>
              <span class="text-slate-700 font-medium">Proposal defense</span>
            </div>
            <div class="pt-1 border-t border-slate-200 flex items-center justify-between text-[11px]">
              <span class="text-slate-500">Status:</span>
              <span id="sidebar-pr-status-pill" class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">In review</span>
            </div>
          </div>
        </div>
      </div>

    </aside>

    <!-- Main Content Dynamic View Area -->
    <main id="app-workspace" class="flex-1 bg-[#F8FAFC] overflow-y-auto custom-scrollbar flex flex-col">
      <!-- Injected view components render here -->
    </main>
  </div>

  <div class="fixed bottom-4 right-4 z-50">
    <div id="persona-switcher-menu" class="hidden mb-2 w-80 bg-white rounded-lg shadow-lg border border-slate-200 overflow-hidden">
      <div class="p-3 border-b border-slate-200">
        <span class="text-xs font-semibold text-slate-900">Switch account</span>
      </div>
      <div class="p-1 space-y-1 max-h-80 overflow-y-auto custom-scrollbar" id="persona-list-items"></div>
    </div>

    <!-- Toggle Trigger Pill Button -->
    <button id="persona-switcher-trigger" class="flex items-center space-x-2.5 bg-slate-900 hover:bg-slate-800 text-white px-3.5 py-2.5 rounded-full shadow-lg border border-slate-700 transition active:scale-95 text-xs font-medium focus:outline-none">
      <i data-lucide="shield" class="w-4 h-4 text-emerald-400"></i>
      <span class="font-semibold" id="trigger-user-name">Juan Dela Cruz</span>
      <span class="px-2 py-0.5 rounded-full text-[10px] font-mono bg-slate-800 text-slate-300 border border-slate-700" id="trigger-user-role">Student</span>
      <i data-lucide="chevron-up" class="w-3.5 h-3.5 text-slate-400" id="trigger-chevron"></i>
    </button>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed top-16 right-6 z-50 space-y-2 pointer-events-none"></div>

          status: 'PENDING',
          requestedBy: 'Juan Dela Cruz'
        },
        {
          id: 'SLOT-02',

          facultyName: 'Engr. Marco Santos',

          date: '2025-03-20',

          requestedBy: null
        },
        {
          id: 'SLOT-03',

          date: '2025-03-21',
          timeWindow: '09:00 AM - 11:00 AM',

          requestedBy: null
        }
      ],

      parkedActions: {

          {
            id: 'DEF-REQ-01',

          }
        ]
      },

      metrics: {
        activeStudents: 24,

        awaitingDefense: 5,
        gate2Revisions: 6
      }
    };

    // Helper functions
    function getActivePersona() {
      return STATE.accounts.find(a => a.id === STATE.activePersonaId) || STATE.accounts[0];
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-800 text-white border-emerald-700',
        warning: 'bg-amber-800 text-white border-amber-700',
        error: 'bg-rose-800 text-white border-rose-700',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      toast.className = `px-4 py-2.5 rounded shadow-lg border text-xs flex items-center space-x-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto ${colors[type] || colors.info}`;
      toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle' : type === 'warning' ? 'alert-triangle' : 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 20);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    const ROLE_ROUTES = {
      'Student': ['/student/dashboard', '/student/pr/104', '/student/schedule'],
      'Thesis Adviser': ['/adviser/dashboard', '/adviser/pr/104', '/adviser/availability'],
      'Panel Member': ['/panel/dashboard', '/panel/pr/104', '/panel/availability'],
      'Program Coordinator': ['/coordinator/dashboard', '/coordinator/templates', '/coordinator/users']
    };

    function statusLabel(code) {
      const labels = {
        DRAFT_UPLOADED: 'Draft uploaded',
        GATE_1_REVIEW: 'In review',
        GATE_1_ENDORSED: 'Endorsed',
        DEFENSE_SCHEDULED: 'Defense scheduled',
        POST_DEFENSE_REVISIONS: 'Revisions open',
        GATE_2_APPROVED: 'Approved',
        OPEN: 'Open',
        RESOLVED: 'Resolved',
        PENDING: 'Pending',
        CONFIRMED: 'Confirmed',
        AVAILABLE: 'Open',
        DECLINED: 'Declined',
        UNLOCKED: 'Recorded',
        PENDING_COORDINATOR: 'Pending',
        PENDING_ENCODING: 'Needs a result',
        ON_TRACK: 'On track'
      };
      return labels[code] || code;
    }

    function revisionName(id, latestId) {
      const number = String(id).replace(/^v/i, '');
      const latest = latestId && id === latestId ? ' — Latest' : '';
      return `Revision ${number}${latest}`;
    }

    function navigateTo(route) {
      const persona = getActivePersona();
      const allowed = ROLE_ROUTES[persona.role] || [];
      
      if (!allowed.includes(route)) {
        renderAccessDenied(route, persona.role);
        return;
      }

      STATE.currentRoute = route;
      renderApp();
    }

    function switchPersona(personaId) {
      const newPersona = STATE.accounts.find(a => a.id === personaId);
      if (!newPersona) return;
      STATE.activePersonaId = personaId;
      STATE.currentRoute = newPersona.defaultRoute;
      showToast(`Signed in as ${newPersona.name}`, 'info');
      renderApp();
    }

    function updateShellChrome() {
      const persona = getActivePersona();
      
      document.getElementById('top-user-name').textContent = persona.name;
      document.getElementById('top-user-role').textContent = persona.role;
      document.getElementById('top-user-avatar').textContent = persona.avatarInitials;
      
      document.getElementById('trigger-user-name').textContent = persona.name;
      document.getElementById('trigger-user-role').textContent = persona.role;

      const prPill = document.getElementById('sidebar-pr-status-pill');
      if (prPill) {
        prPill.textContent = statusLabel(STATE.thesis.prStatus);
        if (STATE.thesis.prStatus === 'GATE_1_REVIEW') {
          prPill.className = 'font-mono px-1.5 py-0.5 rounded text-[10px] font-semibold bg-amber-50 text-amber-700 border border-amber-200';
        } else if (STATE.thesis.prStatus === 'GATE_1_ENDORSED' || STATE.thesis.prStatus === 'GATE_2_APPROVED') {
          prPill.className = 'font-mono px-1.5 py-0.5 rounded text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
        } else {
          prPill.className = 'font-mono px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-700 border border-slate-200';
        }
      }

      const navContainer = document.getElementById('sidebar-nav-links');
      let navItems = [];

      if (persona.role === 'Student') {
        navItems = [
          { path: '/student/dashboard', label: 'My thesis', icon: 'compass' },
          { path: '/student/pr/104', label: 'Submission', icon: 'file-text' },
          { path: '/student/schedule', label: 'Schedule', icon: 'calendar-clock' }
        ];
      } else if (persona.role === 'Thesis Adviser') {
        navItems = [
          { path: '/adviser/dashboard', label: 'Advisees', icon: 'users' },
          { path: '/adviser/pr/104', label: 'Review', icon: 'file-text' },
          { path: '/adviser/availability', label: 'Availability', icon: 'calendar' }
        ];
      } else if (persona.role === 'Panel Member') {
        navItems = [
          { path: '/panel/dashboard', label: 'Defenses', icon: 'clipboard-check' },
          { path: '/panel/pr/104', label: 'Manuscript', icon: 'file-check-2' },
          { path: '/panel/availability', label: 'Availability', icon: 'calendar' }
        ];
      } else if (persona.role === 'Program Coordinator') {
        navItems = [
          { path: '/coordinator/dashboard', label: 'Overview', icon: 'layout-grid' },
          { path: '/coordinator/templates', label: 'Templates', icon: 'layers' },
          { path: '/coordinator/users', label: 'Committee', icon: 'user-check' }
        ];
      }

      navContainer.innerHTML = navItems.map(item => {
        const isActive = STATE.currentRoute === item.path;
        return `
          <button onclick="navigateTo('${item.path}')" class="w-full flex items-center space-x-2.5 px-3 py-2 rounded-md text-xs font-medium transition ${
            isActive 
              ? 'bg-brand-maroon-tint text-brand-maroon font-semibold border border-red-200' 
              : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
          }">
            <i data-lucide="${item.icon}" class="w-4 h-4 ${isActive ? 'text-brand-maroon' : 'text-slate-400'}"></i>
            <span>${item.label}</span>
          </button>
        `;
      }).join('');

      const listContainer = document.getElementById('persona-list-items');
      listContainer.innerHTML = STATE.accounts.map(acc => {
        const isCurrent = acc.id === STATE.activePersonaId;
        return `
          <button onclick="switchPersona('${acc.id}'); togglePersonaMenu(false);" class="w-full text-left p-2 rounded flex items-center justify-between text-xs transition ${
            isCurrent ? 'bg-red-50 border border-red-200 text-brand-maroon' : 'hover:bg-slate-50 text-slate-800'
          }">
            <div class="flex items-center space-x-2.5">
              <span class="w-7 h-7 rounded-full bg-slate-200 text-slate-700 flex items-center justify-center font-bold text-[11px]">
                ${acc.avatarInitials}
              </span>
              <div>
                <div class="font-medium text-slate-900">${acc.name}</div>
                <div class="text-[10px] text-slate-500">${acc.role} ${acc.subRole ? '• ' + acc.subRole : ''}</div>
              </div>
            </div>
            ${isCurrent ? '<i data-lucide="check" class="w-4 h-4 text-brand-maroon"></i>' : '<span class="text-[10px] font-mono text-slate-400">Select</span>'}
          </button>
        `;
      }).join('');
    }

    function togglePersonaMenu(forceState) {
      const menu = document.getElementById('persona-switcher-menu');
      const chevron = document.getElementById('trigger-chevron');
      const isHidden = menu.classList.contains('hidden');
      const shouldOpen = typeof forceState === 'boolean' ? forceState : isHidden;

      if (shouldOpen) {
        menu.classList.remove('hidden');
        chevron.style.transform = 'rotate(180deg)';
      } else {
        menu.classList.add('hidden');
        chevron.style.transform = 'rotate(0deg)';
      }
      lucide.createIcons();
    }

    function renderAccessDenied(attemptedRoute, role) {
      const workspace = document.getElementById('app-workspace');
      workspace.innerHTML = `
        <div class="p-8 max-w-2xl mx-auto my-auto text-center">
          <div class="w-12 h-12 rounded-full bg-red-100 text-rose-700 flex items-center justify-center mx-auto mb-4 border border-rose-200">
            <i data-lucide="shield-alert" class="w-6 h-6"></i>
          </div>
          <h2 class="text-lg font-bold text-slate-900 mb-1">You don't have access</h2>
          <p class="text-sm text-slate-600 mb-4">This page is not part of your account.</p>
          <div class="inline-flex space-x-3">
            <button onclick="navigateTo('${getActivePersona().defaultRoute}')" class="px-4 py-2 bg-brand-maroon text-white text-xs font-semibold rounded hover:bg-brand-maroon-hover transition">
              Back to your dashboard
            </button>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function renderPrWorkspace() {
      const persona = getActivePersona();
      const pr = STATE.thesis;
      const isPanel = persona.role === 'Panel Member';
      const isAdviser = persona.role === 'Thesis Adviser';
      const isStudent = persona.role === 'Student';

      const isPanelPreGate1 = isPanel && (pr.prStatus === 'DRAFT_UPLOADED' || pr.prStatus === 'GATE_1_REVIEW');

      if (isPanelPreGate1) {
        document.getElementById('app-workspace').innerHTML = `
          <div class="p-8 max-w-2xl mx-auto my-auto text-center bg-white rounded-lg border border-slate-200 shadow-sm p-8">
            <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center mx-auto mb-3 border border-amber-200">
              <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <h2 class="text-base font-bold text-slate-900 mb-1">Manuscript not available yet</h2>
            <p class="text-sm text-slate-600 mb-2">
              Dr. Elena Reyes is still reviewing this submission. You can read it after she endorses it for defense.
            </p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const activeCommitData = pr.commits.find(c => c.id === pr.selectedCommit) || pr.commits[pr.commits.length - 1];
      const openThreadsCount = pr.critiqueThreads.filter(t => t.status === 'OPEN').length;
      const latestCommitId = pr.commits[pr.commits.length - 1].id;

      document.getElementById('app-workspace').innerHTML = `
        <div class="flex flex-col h-full">
          <div class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between flex-shrink-0">
            <div class="flex items-center space-x-3">
              <span class="text-xs font-medium text-slate-800">${pr.stage}</span>
              <span class="px-2 py-0.5 rounded text-[11px] font-semibold ${
                pr.prStatus === 'GATE_1_ENDORSED' || pr.prStatus === 'GATE_2_APPROVED'
                  ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                  : 'bg-amber-50 text-amber-700 border border-amber-200'
              }">${statusLabel(pr.prStatus)}</span>

              <div class="flex items-center space-x-1.5 ml-1 pl-3 border-l border-slate-200">
                <span class="text-[11px] text-slate-500 font-medium">File</span>
                <select id="pr-commit-select" onchange="changePrCommit(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded px-2 py-1 text-slate-800 font-medium focus:ring-1 focus:ring-brand-maroon focus:outline-none">
                  ${pr.commits.map(c => `
                    <option value="${c.id}" ${c.id === pr.selectedCommit ? 'selected' : ''}>
                      ${revisionName(c.id, latestCommitId)}
                    </option>
                  `).join('')}
                </select>
              </div>
            </div>
          </div>

          <div class="flex-1 flex overflow-hidden">
            <div class="w-[60%] border-r border-slate-200 flex flex-col bg-slate-100">
              <div class="h-10 bg-white border-b border-slate-200 px-4 flex items-center justify-between text-xs">
                <div class="flex items-center space-x-2">
                  <i data-lucide="file-text" class="w-4 h-4 text-brand-maroon"></i>
                  <span class="font-mono font-medium text-slate-800">${activeCommitData.filename}</span>
                  <span class="text-[10px] font-mono text-slate-400">(${activeCommitData.timestamp})</span>

    function uploadStudentCommit() {
      const nextVer = `v${STATE.thesis.commits.length + 1}`;
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const dateStr = new Date().toISOString().split('T')[0];

      STATE.thesis.commits.push({
        id: nextVer,
        timestamp: `${dateStr} ${now}`,
        filename: `EchoWood_Proposal_${nextVer}.pdf`,
        pages: 20,
        notes: 'Updated the sensor bandwidth section and the chapter 3 diagram.'
      });

      STATE.thesis.selectedCommit = nextVer;
      showToast(`${revisionName(nextVer)} uploaded`, 'success');
      renderApp();
    }

    function postThreadReply(threadId) {
      const input = document.getElementById(`reply-input-${threadId}`);
      if (!input || !input.value.trim()) return;

      const persona = getActivePersona();
      const thread = STATE.thesis.critiqueThreads.find(t => t.id === threadId);
      if (!thread) return;

      thread.replies.push({
        id: `REP-${Date.now()}`,
        authorId: persona.id,
        authorName: persona.name,
        timestamp: 'Just now',
        content: input.value.trim()
      });

      showToast('Reply posted', 'info');
      renderApp();
    }

    function toggleThreadResolution(threadId) {
      const thread = STATE.thesis.critiqueThreads.find(t => t.id === threadId);
      if (!thread) return;

      thread.status = thread.status === 'RESOLVED' ? 'OPEN' : 'RESOLVED';
      showToast(thread.status === 'RESOLVED' ? 'Comment resolved' : 'Comment reopened', thread.status === 'RESOLVED' ? 'success' : 'warning');
      renderApp();
    }

    function postNewCritiqueThread() {
      const textarea = document.getElementById('new-thread-text');
      if (!textarea || !textarea.value.trim()) return;

      const persona = getActivePersona();
      const newId = `CT-${STATE.thesis.critiqueThreads.length + 101}`;

      STATE.thesis.critiqueThreads.push({
        id: newId,
        anchoredCommit: STATE.thesis.selectedCommit,
        authorId: persona.id,
        authorName: persona.name,
        authorRole: persona.role,
        timestamp: 'Just now',
        status: 'OPEN',
        content: textarea.value.trim(),
        replies: []
      });

      showToast('Comment posted', 'info');
      renderApp();
    }

      selectedAdviserSlotType = type;
      const bc = document.getElementById('adviser-type-consult');
      const bd = document.getElementById('adviser-type-defense');
      if (type === 'Consultation') {
        bc.className = 'p-1.5 text-xs font-semibold rounded border border-brand-maroon bg-red-50 text-brand-maroon';
        bd.className = 'p-1.5 text-xs font-medium rounded border border-slate-200 text-slate-600 hover:bg-slate-50';
      } else {
        bd.className = 'p-1.5 text-xs font-semibold rounded border border-brand-maroon bg-red-50 text-brand-maroon';
        bc.className = 'p-1.5 text-xs font-medium rounded border border-slate-200 text-slate-600 hover:bg-slate-50';
      }
    }

    function publishAdviserSlot() {
      const d = document.getElementById('adviser-slot-date').value;
      const t = document.getElementById('adviser-slot-time').value;
      STATE.availabilitySlots.push({
        id: `SLOT-${Date.now()}`,
        facultyId: 'USR-ADV-01',
        facultyName: 'Dr. Elena Reyes',
        role: 'Thesis Adviser',
        date: d,
        timeWindow: t,
        slotType: selectedAdviserSlotType,
        status: 'AVAILABLE',
        requestedBy: null
      });
      showToast('Time published', 'success');
      renderApp();
    }

    function publishPanelSlot() {
      const d = document.getElementById('panel-slot-date').value;
      const t = document.getElementById('panel-slot-time').value;
      const persona = getActivePersona();
      STATE.availabilitySlots.push({
        id: `SLOT-${Date.now()}`,
        facultyId: persona.id,
        facultyName: persona.name,
        role: 'Panel Member',
        date: d,
        timeWindow: t,
        slotType: 'Defense',
        status: 'AVAILABLE',
        requestedBy: null
      });
      showToast('Time published', 'success');
      renderApp();
    }

    function requestAvailabilitySlot(slotId) {
      const slot = STATE.availabilitySlots.find(s => s.id === slotId);
      if (slot) {
        slot.status = 'PENDING';
        slot.requestedBy = getActivePersona().name;
        showToast(`Request sent to ${slot.facultyName}`, 'info');
        renderApp();
      }
    }

    function confirmAdviserRequest(slotId) {
      const slot = STATE.availabilitySlots.find(s => s.id === slotId);
      if (slot) {
        slot.status = 'CONFIRMED';
        showToast('Consultation confirmed', 'success');
        renderApp();
      }
    }

    function declineAdviserRequest(slotId) {
      const slot = STATE.availabilitySlots.find(s => s.id === slotId);
      if (slot) {
        slot.status = 'AVAILABLE';
        slot.requestedBy = null;
        showToast('Request declined', 'info');
        renderApp();
      }
    }

    function renderApp() {
      updateShellChrome();

      const r = STATE.currentRoute;
      if (r === '/student/dashboard' || r === '/student/schedule') {
        renderStudentDashboard();
      } else if (r === '/adviser/dashboard' || r === '/adviser/availability') {
        renderAdviserDashboard();
      } else if (r === '/coordinator/dashboard' || r === '/coordinator/templates' || r === '/coordinator/users') {
        renderCoordinatorDashboard();
      } else if (r === '/panel/dashboard' || r === '/panel/availability') {
        renderPanelDashboard();
      } else if (r === '/student/pr/104' || r === '/adviser/pr/104' || r === '/panel/pr/104') {
        renderPrWorkspace();
      } else {
        renderStudentDashboard();
      }

      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('persona-switcher-trigger').addEventListener('click', (e) => {
        e.stopPropagation();
        togglePersonaMenu();
      });

      document.addEventListener('click', (e) => {
        const menu = document.getElementById('persona-switcher-menu');
        const trigger = document.getElementById('persona-switcher-trigger');
        if (!menu.contains(e.target) && !trigger.contains(e.target)) {
          togglePersonaMenu(false);
        }
      });

      renderApp();
    });
  </script>
</body>
</html>
