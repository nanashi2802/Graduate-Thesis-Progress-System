    function accountControlsCard() {
      const rows = STATE.accounts.map(function (acc) {
        return '<tr class="border-t border-[#E2E8F0]"><td class="px-4 py-3">' + escapeHtml(acc.name) + '</td><td class="px-4 py-3 whitespace-nowrap">' + escapeHtml(acc.role) + (acc.subRole ? ' · ' + escapeHtml(acc.subRole) : '') + '</td><td class="px-4 py-3 text-slate-500">' + escapeHtml(acc.assignedThesis) + '</td><td class="px-4 py-3"><span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold bg-[#F0FDF4] text-[#15803D] border border-emerald-200">Active</span></td><td class="px-4 py-3"><div class="flex items-center justify-end gap-2">' + laterControl('Change role') + laterControl('Deactivate') + '</div></td></tr>';
      }).join('');
      return '<section class="bg-white border border-[#E2E8F0] rounded-lg overflow-hidden">' +
        '<div class="px-4 py-3 border-b border-[#E2E8F0] flex items-start justify-between gap-4"><div><div class="flex items-center gap-2"><span class="text-xs font-semibold text-slate-900">Account controls</span><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold bg-slate-100 text-slate-500 border border-slate-200">Later</span></div><p class="text-xs text-slate-500 mt-1">Adding an account, changing a role, and closing an account are reserved for a later phase. The directory is the current demo set.</p></div>' +
        laterControl('Add account') + '</div>' +
        '<div class="grid grid-cols-1 md:grid-cols-4 gap-3 px-4 py-3 border-b border-[#E2E8F0] bg-[#F8FAFC]">' +
          '<label class="text-[11px] text-slate-500">Name<input disabled placeholder="Full name" class="mt-1 w-full text-xs p-2 border border-[#E2E8F0] rounded bg-white text-slate-400 cursor-not-allowed" /></label>' +
          '<label class="text-[11px] text-slate-500">Role<select disabled class="mt-1 w-full text-xs p-2 border border-[#E2E8F0] rounded bg-white text-slate-400 cursor-not-allowed"><option>Student</option><option>Thesis Adviser</option><option>Panel Member</option><option>Program Coordinator</option></select></label>' +
          '<label class="text-[11px] text-slate-500 md:col-span-2">Sign-in<input disabled placeholder="University email" class="mt-1 w-full text-xs p-2 border border-[#E2E8F0] rounded bg-white text-slate-400 cursor-not-allowed" /></label>' +
        '</div>' +
        '<div class="overflow-x-auto"><table class="w-full text-left text-xs text-slate-800"><thead class="text-slate-500"><tr><th class="h-11 px-4 font-medium">Name</th><th class="h-11 px-4 font-medium">Role</th><th class="h-11 px-4 font-medium">Thesis</th><th class="h-11 px-4 font-medium">Status</th><th class="h-11 px-4"></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
    }

    function assignmentCard() {
      const seats = [
        ['adviserId', 'Adviser'],
        ['leadId', 'Lead panelist'],
        ['panelId', 'Panelist']
      ];
      const faculty = STATE.accounts.filter(function (acc) {
        return acc.role === 'Thesis Adviser' || acc.role === 'Panel Member';
      });
      return '<div class="bg-white border border-[#E2E8F0] rounded-lg p-4 space-y-3"><div class="text-xs font-semibold text-slate-800">Assignment for Juan Dela Cruz</div><div class="grid grid-cols-1 md:grid-cols-3 gap-3">' +
        seats.map(function (seat) {
          const options = faculty.map(function (acc) {
            return '<option value="' + acc.id + '"' + (acc.id === STATE.committee[seat[0]] ? ' selected' : '') + '>' + escapeHtml(acc.name) + '</option>';
          }).join('');
          return '<label class="text-xs text-slate-600">' + seat[1] + '<select onchange="setCommitteeSeat(\'' + seat[0] + '\', this.value)" class="mt-1 w-full text-xs p-2 border border-[#E2E8F0] rounded bg-white">' + options + '</select></label>';
        }).join('') +
        '</div><p class="text-[11px] text-slate-500">One person cannot hold two of these seats. The lead-panelist label does not add a separate approval.</p></div>';
    }

    function requestDefenseSlot(slotId) {
      if (!defenseUnlocked()) {
        showToast('Defense booking opens after your adviser endorses the manuscript.', 'warning');
        return;
      }
      const slot = STATE.availabilitySlots.find(function (item) { return item.id === slotId; });
      if (!slot) return;
      slot.status = 'PENDING';
      slot.requestedBy = getActivePersona().name;
      const pending = STATE.parkedActions.defenseRequests.filter(function (item) { return item.status === 'PENDING_COORDINATOR'; })[0];
      if (pending) {
        pending.targetDate = slot.date;
        pending.timeWindow = slot.timeWindow;
      }
      showToast('Defense request sent to the coordinator', 'info');
      renderApp();
    }

    function requestAvailabilitySlot(slotId) {
      const slot = STATE.availabilitySlots.find(function (item) { return item.id === slotId; });
      if (!slot) return;
      slot.status = 'PENDING';
      slot.requestedBy = getActivePersona().name;
      showToast('Request sent to ' + slot.facultyName, 'info');
      renderApp();
    }

    function confirmAdviserRequest(slotId) {
      const slot = STATE.availabilitySlots.find(function (item) { return item.id === slotId; });
      if (!slot) return;
      slot.status = 'CONFIRMED';
      showToast('Consultation confirmed', 'success');
      renderApp();
    }

    function declineAdviserRequest(slotId) {
      const slot = STATE.availabilitySlots.find(function (item) { return item.id === slotId; });
      if (!slot) return;
      slot.status = 'AVAILABLE';
      slot.requestedBy = null;
      showToast('Request declined', 'info');
      renderApp();
    }

    function renderRosterOnlyAccount() {
      const persona = getActivePersona();
      document.getElementById('workspace-body').innerHTML = pageWrap(
        '<div class="max-w-xl bg-white border border-[#E2E8F0] rounded-lg p-6 space-y-3">' +
          '<div class="text-[11px] font-mono text-slate-400">Stage 4 of 4 · Oral defense</div>' +
          '<h2 class="text-lg font-semibold text-slate-900">' + escapeHtml(persona.name) + '</h2>' +
          '<p class="text-sm text-slate-700">' + escapeHtml(persona.assignedThesis) + '</p>' +
          '<p class="text-xs text-slate-500 leading-relaxed">This account is on the adviser, panel, and coordinator lists. It has no pages in this prototype.</p>' +
          statusBadge('Approved') +
        '</div>'
      );
    }

    function renderApp() {
      updateShellChrome();
      const route = STATE.currentRoute;
      if (getActivePersona().hasWorkspace === false) renderRosterOnlyAccount();
      else if (route === '/student/dashboard' || route === '/student/deliverables' || route === '/student/templates' || route === '/student/schedule') renderStudentDashboard();
      else if (route === '/adviser/dashboard' || route === '/adviser/availability') renderAdviserDashboard();
      else if (route === '/coordinator/dashboard' || route === '/coordinator/templates' || route === '/coordinator/users') renderCoordinatorDashboard();
      else if (route === '/panel/dashboard' || route === '/panel/availability') renderPanelDashboard();
      else if (isPrRoute(route)) renderPrWorkspace();
      else renderStudentDashboard();
      lucide.createIcons();
      if (pendingFocusId) {
        const field = document.getElementById(pendingFocusId);
        pendingFocusId = null;
        if (field) {
          field.focus();
          const length = field.value.length;
          field.setSelectionRange(length, length);
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      const personaShell = document.getElementById('persona-switcher');
      const personaTrigger = document.getElementById('persona-switcher-trigger');
      let personaDrag = null;
      let personaSuppressClick = false;

      function movePersonaSwitcher(left, top) {
        const width = personaTrigger.offsetWidth;
        const height = personaTrigger.offsetHeight;
        const nextLeft = Math.max(8, Math.min(left, window.innerWidth - width - 8));
        const nextTop = Math.max(8, Math.min(top, window.innerHeight - height - 8));
        personaShell.style.left = nextLeft + 'px';
        personaShell.style.top = nextTop + 'px';
        personaShell.style.right = 'auto';
        personaShell.style.bottom = 'auto';
      }

      personaTrigger.addEventListener('pointerdown', function (event) {
        if (event.button !== 0) return;
        const rect = personaShell.getBoundingClientRect();
        personaDrag = { dx: event.clientX - rect.left, dy: event.clientY - rect.top, moved: false };
        try { personaTrigger.setPointerCapture(event.pointerId); } catch (err) { /* synthetic pointers */ }
      });
      personaTrigger.addEventListener('pointermove', function (event) {
        if (!personaDrag) return;
        const rect = personaShell.getBoundingClientRect();
        const travel = Math.hypot(event.clientX - (rect.left + personaDrag.dx), event.clientY - (rect.top + personaDrag.dy));
        if (travel > 4) personaDrag.moved = true;
        if (!personaDrag.moved) return;
        movePersonaSwitcher(event.clientX - personaDrag.dx, event.clientY - personaDrag.dy);
        if (!document.getElementById('persona-switcher-menu').classList.contains('hidden')) placePersonaMenu();
      });
      personaTrigger.addEventListener('pointerup', function () {
        if (personaDrag && personaDrag.moved) personaSuppressClick = true;
        personaDrag = null;
      });
      personaTrigger.addEventListener('click', function (event) {
        event.stopPropagation();
        if (personaSuppressClick) {
          personaSuppressClick = false;
          return;
        }
        togglePersonaMenu();
      });
      document.addEventListener('click', function (event) {
        const menu = document.getElementById('persona-switcher-menu');
        const trigger = document.getElementById('persona-switcher-trigger');
        if (!menu.contains(event.target) && !trigger.contains(event.target)) togglePersonaMenu(false);
      });
      renderApp();
    });
  </script>
</body>
